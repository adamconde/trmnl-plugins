---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: ''
polling_url: |-
  {%- comment -%} Poll only what the selected metrics need (order matches SOURCES in transform.py). {%- endcomment -%}
  {%- assign m = metrics | join: ',' | remove: ' ' | prepend: ',' | append: ',' -%}
  {%- if m == ',,' -%}{%- assign m = ',readiness,sleep,activity,stress,' -%}{%- endif -%}
  {%- if m contains ',readiness,' or m contains ',temperature,' -%}
  https://api.ouraring.com/v2/usercollection/daily_readiness?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score,temperature_deviation
  {% endif -%}
  {%- if m contains ',sleep,' -%}
  https://api.ouraring.com/v2/usercollection/daily_sleep?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score
  {% endif -%}
  {%- if m contains ',activity,' or m contains ',steps,' -%}
  https://api.ouraring.com/v2/usercollection/daily_activity?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score,steps,equivalent_walking_distance,target_meters
  {% endif -%}
  {%- if m contains ',stress,' -%}
  https://api.ouraring.com/v2/usercollection/daily_stress?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,day_summary,stress_high,recovery_high
  {% endif -%}
  {%- if m contains ',total_sleep,' or m contains ',resting_hr,' or m contains ',hrv,' -%}
  https://api.ouraring.com/v2/usercollection/sleep?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,type,total_sleep_duration,lowest_heart_rate,average_hrv
  {% endif -%}
  {%- if m contains ',resilience,' -%}
  https://api.ouraring.com/v2/usercollection/daily_resilience?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}
  {% endif -%}
  {%- if m contains ',spo2,' -%}
  https://api.ouraring.com/v2/usercollection/daily_spo2?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,spo2_percentage
  {% endif -%}
  {%- if m contains ',cardio_age,' -%}
  https://api.ouraring.com/v2/usercollection/daily_cardiovascular_age?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,vascular_age
  {% endif -%}
  {%- if m contains ',vo2_max,' -%}
  https://api.ouraring.com/v2/usercollection/vO2_max?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,vo2_max
  {% endif -%}
polling_headers: authorization=Bearer {{ oauth_access_token }}
polling_body: ''
id: 491892
oauth_enabled: 'true'
oauth_pkce_enabled: 'yes'
oauth_authorize_url: https://cloud.ouraring.com/oauth/authorize
oauth_token_url: https://api.ouraring.com/oauth/token
oauth_scopes: daily spo2 heart_health
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: https://api.ouraring.com
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: Your Oura Ring scores as rings, with a 7-day trend under each one. Pick which metrics to show below; the default is Readiness, Sleep, Activity and Stress.<br/><br/>Needs your own Oura API application for OAuth. See the <a href="https://github.com/adamconde/trmnl-plugins/blob/main/plugins/oura/README.md" class="underline" target="_blank">setup instructions</a>.<br/><br/>Version 1.0.0
  learn_more_url: https://github.com/adamconde/trmnl-plugins/blob/main/plugins/oura/README.md
  category: personal,life
- keyname: metrics
  name: Metrics
  field_type: select
  multiple: true
  optional: true
  description: Shown in this order. Full screen fits 8, half screen 4 to 6, quadrant 4; extras are left off.
  help_text: Leave empty for Readiness, Sleep, Activity and Stress.
  options:
  - Readiness: readiness
  - Sleep: sleep
  - Activity: activity
  - Stress: stress
  - Resilience: resilience
  - Total sleep: total_sleep
  - Steps: steps
  - Resting heart rate: resting_hr
  - HRV: hrv
  - Blood oxygen (SpO2): spo2
  - Cardiovascular age: cardio_age
  - Cardio capacity (VO2 max): vo2_max
  - Temperature deviation: temperature
  default:
  - readiness
  - sleep
  - activity
  - stress
name: Oura
description: Oura Ring scores and trends
refresh_interval: 60
