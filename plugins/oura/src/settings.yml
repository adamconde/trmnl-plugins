---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: ''
polling_url: "{%- comment -%} Poll only what the selected metrics need (order matches SOURCES in transform.py). {%- endcomment -%}\r\n{%- assign m = metrics | join: ',' | remove: ' ' | prepend: ',' | append: ',' -%}\r\n{%- if m == ',,' -%}{%- assign m = ',readiness,sleep,activity,stress,' -%}{%- endif -%}\r\n{%- if m contains ',readiness,' or m contains ',temperature,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_readiness?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score,temperature_deviation\r\n{% endif -%}\r\n{%- if m contains ',sleep,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_sleep?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score\r\n{% endif -%}\r\n{%- if m contains ',activity,' or m contains ',steps,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_activity?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,score,steps,equivalent_walking_distance,target_meters\r\n{% endif -%}\r\n{%- if m contains ',stress,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_stress?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,day_summary,stress_high,recovery_high\r\n{% endif -%}\r\n{%- if m contains ',total_sleep,' or m contains ',resting_hr,' or m contains ',hrv,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/sleep?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,type,total_sleep_duration,lowest_heart_rate,average_hrv\r\n{% endif -%}\r\n{%- if m contains ',resilience,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_resilience?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}\r\n{% endif -%}\r\n{%- if m contains ',spo2,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_spo2?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,spo2_percentage\r\n{% endif -%}\r\n{%- if m contains ',cardio_age,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/daily_cardiovascular_age?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,vascular_age\r\n{% endif -%}\r\n{%- if m contains ',vo2_max,' -%}\r\nhttps://api.ouraring.com/v2/usercollection/vO2_max?start_date={{ 'now' | date: '%s' | minus: 604800 | date: '%Y-%m-%d' }}&end_date={{ 'now' | date: '%s' | plus: 86400 | date: '%Y-%m-%d' }}&fields=day,vo2_max\r\n{% endif -%}"
polling_headers: authorization=Bearer {{ oauth_access_token }}
polling_body: ''
id: 491892
oauth_enabled: 'true'
oauth_pkce_enabled: 'yes'
oauth_authorize_url: https://cloud.ouraring.com/oauth/authorize
oauth_token_url: https://api.ouraring.com/oauth/token
oauth_scopes: daily spo2 heart_health
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: https://api.ouraring.com
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: Your Oura Ring scores as rings, with a 7-day trend under each one. Pick which metrics to show below; the default is Readiness, Sleep, Activity and Stress.<br/><br/>Needs your own Oura API application for OAuth. See the <a href="https://github.com/adamconde/trmnl-plugins/blob/main/plugins/oura/README.md" class="underline" target="_blank">setup instructions</a>.<br/><br/>Version 1.0.0
  learn_more_url: https://github.com/adamconde/trmnl-plugins/blob/main/plugins/oura/README.md
  category: personal,life
- keyname: metrics
  name: Metrics
  field_type: select
  multiple: true
  optional: true
  description: Shown in this order. Full screen fits 8, half screen 4 to 6, quadrant 4; extras are left off.
  help_text: Leave empty for Readiness, Sleep, Activity and Stress.
  options:
  - Readiness: readiness
  - Sleep: sleep
  - Activity: activity
  - Stress: stress
  - Resilience: resilience
  - Total sleep: total_sleep
  - Steps: steps
  - Resting heart rate: resting_hr
  - HRV: hrv
  - Blood oxygen (SpO2): spo2
  - Cardiovascular age: cardio_age
  - Cardio capacity (VO2 max): vo2_max
  - Temperature deviation: temperature
  default:
  - readiness
  - sleep
  - activity
  - stress
name: Oura
description: Oura Ring scores and trends
recipe_overview: "Oura turns your Oura Ring data into a glanceable dashboard on your TRMNL. Each metric is drawn as a ring, like the ones in the Oura app, with the value in the center and a row of bars underneath showing your last seven days.\r\n\r\nBy default it shows your Readiness, Sleep, Activity and Stress. Score rings fill to the score and carry Oura's rating underneath, from Optimal to Pay attention. Stress shows whether your day was restored, normal or stressful, with time spent stressed and restored. The full-screen view also compares today with your weekly average, such as \"+4 vs 7-day avg\".\r\n\r\nYou can pick other metrics instead, or add them: Resilience, Total sleep, Steps toward your daily activity goal, Resting heart rate, HRV, Blood oxygen, Cardiovascular age, Cardio capacity (VO2 max) and Temperature deviation. Full screen fits up to eight metrics, half screen four to six, and a quarter screen four, so it sits comfortably in a mashup with your other plugins.\r\n\r\nSleep scores appear after you open the Oura app and sync in the morning. Until then, each tile shows the previous day and labels it.\r\n\r\nSetup takes a few minutes. Oura requires OAuth, so you create a free Oura API application, paste its client ID and secret into the plugin, and connect your account. Step-by-step instructions are in the GitHub README linked from this recipe."
refresh_interval: 60
