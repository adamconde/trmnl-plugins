name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          plugins=$(find plugins -mindepth 2 -maxdepth 2 -name .trmnlp.yml -printf '%h\n' | xargs -rn1 basename | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  lint:
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  push:
    needs: [discover, lint]
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      # Without an `id`, every push would create a new plugin on TRMNL.
      # Run `trmnlp push` once locally, then commit the `id` it writes.
      - name: Push
        run: |
          if grep -qE '^id:' src/settings.yml; then
            trmnlp push --force
          else
            echo "::notice::${{ matrix.plugin }} has no id in src/settings.yml; skipping push"
          fi
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
